apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx-default-config
data:
  default.conf: |
    upstream backend {
        server {{ .Values.backend.serviceName }}:{{ .Values.backend.servicePort }};
    }
    
    upstream frontend {
        server {{ .Values.frontend.serviceName }}:{{ .Values.frontend.servicePort }};
    }
    
    server {
        listen 8080;
        server_name _;

        # Backend API routes - must come before root location
        location /api {
            # Remove /api prefix and forward to backend
            rewrite ^/api(/.*)$ $1 break;
            rewrite ^/api$ / break;
            
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Frontend routes - catch-all for SPA
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }
    }
