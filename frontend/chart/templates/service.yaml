apiVersion: v1
kind: Service
metadata:
  name: { { include "frontend.fullname" . } }
  labels: { { - include "frontend.labels" . | nindent 4 } }
spec:
  type: { { .Values.service.type } }
  ports:
    - port: { { .Values.service.port } }
      targetPort: 8080
      protocol: TCP
      name: http-notesapp-frontend
  selector:
    app.kubernetes.io/name: { { include "frontend.fullname" . } }
