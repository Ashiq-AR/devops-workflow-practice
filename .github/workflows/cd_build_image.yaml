# Manual workflow to build and push Docker images to Docker Hub
# Requires repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN

name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Which service to build (frontend or backend)"
        required: true
        default: "backend"
        type: choice
        options:
          - frontend
          - backend
      cluster:
        description: "Target cluster (common or openshift)"
        required: true
        default: "common"
        type: choice
        options:
          - common
          - openshift
      tag:
        description: "Image tag (default: latest)"
        required: false
        default: "latest"

concurrency:
  group: build-image-${{ github.ref }}-${{ github.event.inputs.service }}-${{ github.event.inputs.cluster }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push ${{ github.event.inputs.service }} image
    runs-on: ubuntu-latest
    env:
      SERVICE: ${{ github.event.inputs.service }}
      CLUSTER: ${{ github.event.inputs.cluster }}
      TAG: ${{ github.event.inputs.tag || 'latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-platform builds)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub 🔐
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Convert repo info to lowercase
        run: |
          if [ "${{ env.CLUSTER }}" == "openshift" ]; then
            echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.SERVICE }}-openshift' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
            echo "DOCKERFILE=openshift.Dockerfile" >> $GITHUB_ENV
          else
            echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.SERVICE }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
            echo "DOCKERFILE=Dockerfile" >> $GITHUB_ENV
          fi

      - name: Build and push image 🚀
        id: build
        uses: docker/build-push-action@v4
        with:
          context: ./${{ env.SERVICE }}
          file: ./${{ env.SERVICE }}/${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Output pushed image names ✅
        run: |
          echo "Image pushed: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"
